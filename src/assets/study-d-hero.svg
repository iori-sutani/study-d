<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.6" stop-color="#131b33"/>
      <stop offset="1" stop-color="#1d2542"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3b30" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff5a4e"/>
      <stop offset="1" stop-color="#ffb199"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="400" fill="url(#night)"/>
  <g fill="none" stroke-linecap="round" filter="url(#glow)">
    <path d="M-20 320 C 180 300, 260 220, 420 210 S 700 150, 830 90" stroke="url(#streak)" stroke-width="5" opacity="0.9"/>
    <path d="M-20 345 C 200 330, 300 250, 460 240 S 700 190, 830 130" stroke="#ff3b30" stroke-width="2.5" opacity="0.45"/>
    <path d="M-20 295 C 160 275, 240 195, 400 185 S 690 110, 830 55" stroke="#ffffff" stroke-width="1.5" opacity="0.28"/>
    <path d="M-20 360 C 220 350, 340 285, 480 275" stroke="#ff8a5c" stroke-width="1.5" opacity="0.3"/>
  </g>
  <g fill="#ffffff" opacity="0.05">
    <rect x="60" y="40" width="120" height="8" rx="4" transform="skewX(-24)"/>
    <rect x="230" y="70" width="80" height="8" rx="4" transform="skewX(-24)"/>
    <rect x="540" y="300" width="140" height="8" rx="4" transform="skewX(-24)"/>
  </g>
</svg>
